<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>OFFCHAT</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; min-height:100%; background:#111113; color:#f5f5f5;
      font-family: system-ui, sans-serif; }
    main { min-height:100dvh; display:flex; flex-direction:column; justify-content:center;
      padding: 2rem 1.25rem; max-width: 22rem; margin: 0 auto; }
    h1 { font-weight: 600; letter-spacing: .14em; font-size: 1.6rem; margin: 0 0 .5rem; }
    p { color:#8e8e93; font-size: .9rem; line-height: 1.5; }
    label { display:block; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase;
      color:#8e8e93; margin-top:1.5rem; }
    input { width:100%; margin-top:.4rem; height:2.75rem; border:0; border-radius:.5rem;
      background:#232327; color:#f5f5f5; padding:0 .85rem; font-size: .95rem; box-sizing:border-box; }
    button { margin-top: .75rem; height:2.75rem; width:100%; border:0; border-radius:.5rem;
      background:#f5f5f5; color:#111113; font-weight:600; font-size:.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>OFFCHAT</h1>
    <p>Offline Social Network. Einmal die Adresse der Website, dann läuft die App.</p>
    <form id="f">
      <label for="u">App-Adresse</label>
      <input id="u" type="url" inputmode="url" autocomplete="url" placeholder="https://" />
      <button type="submit">Öffnen</button>
    </form>
  </main>
  <script>
    function clean(raw) {
      var s = String(raw || "").replace(/\s+/g, " ").trim();
      var beg = "@@OFFCHAT_ORIGIN_BEG@@";
      var end = "@@OFFCHAT_ORIGIN_END@@";
      var i = s.indexOf(beg);
      if (i >= 0) s = s.slice(i + beg.length);
      var j = s.indexOf(end);
      if (j >= 0) s = s.slice(0, j);
      s = s.trim().replace(/\/+$/, "");
      if (!s || s.indexOf("offchat.invalid") >= 0) return "";
      if (s.indexOf("://") < 0) s = "https://" + s;
      return s;
    }
    function go(u) {
      if (!u) return;
      try { localStorage.setItem("offchat-origin", u); } catch (e) {}
      location.replace(u);
    }
    fetch("start_url.txt").then(function (r) { return r.text(); }).then(function (t) {
      var u = clean(t);
      if (u) go(u);
    }).catch(function () {});
    try {
      var saved = localStorage.getItem("offchat-origin");
      if (saved) document.getElementById("u").value = saved;
    } catch (e) {}
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      go(clean(document.getElementById("u").value));
    });
  </script>
</body>
</html>
